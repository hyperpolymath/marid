name: Julia Packages CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.package }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11']
        os: [ubuntu-latest]
        package:
          - MaridIR
          - MaridCodec
          - MaridOpenAPI
          - MaridRPC
          - MaridGraphQL
          - MaridTransport
          - MaridCore
          - ArangoDB
          - MaridStorage
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - name: Run Package Tests
        run: |
          julia --project=packages/${{ matrix.package }} packages/${{ matrix.package }}/test/runtests.jl
